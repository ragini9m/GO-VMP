#!/usr/bin/env python
# Example config: https://github.com/ros/dynamic_reconfigure/blob/melodic-devel/cfg/Test.cfg

PACKAGE = "pointcloud_roi"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

worldcrop = gen.add_group("World clipped")

worldcrop.add("world_x_min_crop", double_t, 1 << 20, "Clipped  minimum x coordinate", -1.5, -10.0, 10.0)
worldcrop.add("world_y_min_crop", double_t, 1 << 20, "Clipped  minimum y coordinate", -3.0, -10.0, 10.0)
worldcrop.add("world_z_min_crop", double_t, 1 << 20, "Clipped  minimum z coordinate", -0.03, -1.0, 10.0)
worldcrop.add("world_x_max_crop", double_t, 1 << 21, "Clipped  maximum x coordinate", 1.5, -10.0, 10.0)
worldcrop.add("world_y_max_crop", double_t, 1 << 21, "Clipped  maximum y coordinate", 3.0, -10.0, 10.0)
worldcrop.add("world_z_max_crop", double_t, 1 << 21, "Clipped  maximum z coordinate", 2.5, -1.0, 10.0)

exit(gen.generate(PACKAGE, "detect_roi", "ClipWorld"))